<!--
  HAND-TRACED from note-previews/notes-p-04.png ("Conduction of water under tension in
  xylem" — tubular vessel with a continuous water column, stacked hydrogen-bonded
  molecules, pulled upward) and note-previews/notes-p-07.png (capillary action tubes).
  Supporting diagram, used in ResolutionScene recap / optional Battle 3 hint.
  Palette: oxygen pink #e84393, hydrogen yellow #f4d03f, water #87ceeb, ink #2c3e50.
-->
<svg id="xylem_1" viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="xylem_blobA" d="M53,-3 C60,15 30,50 2,51 C-25,52 -50,25 -49,4 C-48,-18 -20,-53 -3,-52 C15,-51 48,-25 53,-3 Z" />
    <path id="xylem_blobB" d="M50,4 C55,25 22,53 -4,50 C-28,47 -52,20 -50,-5 C-48,-28 -22,-52 3,-50 C26,-48 48,-18 50,4 Z" />
    <path id="xylem_blobC" d="M48,-8 C58,10 35,48 8,53 C-18,58 -50,30 -51,3 C-52,-22 -28,-50 -2,-51 C22,-52 42,-28 48,-8 Z" />
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c3e50" />
    </marker>
  </defs>

  <g id="xylem_1_vessel" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M90,20 C86,80 94,140 88,200 C84,240 92,270 90,300" />
    <path d="M150,20 C154,70 146,130 152,190 C156,230 148,260 150,300" />
  </g>

  <path id="xylem_1_water"
        d="M91,122 C110,118 130,120 149,122 L152,300 L88,300 Z"
        fill="#87ceeb" fill-opacity="0.45" stroke="none" />

  <g id="xylem_1_molecules">
    <g stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
      <line x1="120" y1="170" x2="120" y2="200" />
      <line x1="120" y1="220" x2="120" y2="250" />
    </g>
    <g transform="translate(120,160)">
      <use href="#xylem_blobA" transform="scale(0.2)" fill="#e84393" fill-opacity="0.4" stroke="#e84393" stroke-width="1.5" vector-effect="non-scaling-stroke" />
      <use href="#xylem_blobB" transform="translate(-7,7) scale(0.1)" fill="#f4d03f" fill-opacity="0.5" stroke="#f4d03f" stroke-width="1" vector-effect="non-scaling-stroke" />
      <use href="#xylem_blobC" transform="translate(7,7) scale(0.1)" fill="#f4d03f" fill-opacity="0.5" stroke="#f4d03f" stroke-width="1" vector-effect="non-scaling-stroke" />
    </g>
    <g transform="translate(120,210)">
      <use href="#xylem_blobB" transform="scale(0.2)" fill="#e84393" fill-opacity="0.4" stroke="#e84393" stroke-width="1.5" vector-effect="non-scaling-stroke" />
      <use href="#xylem_blobC" transform="translate(-7,7) scale(0.1)" fill="#f4d03f" fill-opacity="0.5" stroke="#f4d03f" stroke-width="1" vector-effect="non-scaling-stroke" />
      <use href="#xylem_blobA" transform="translate(7,7) scale(0.1)" fill="#f4d03f" fill-opacity="0.5" stroke="#f4d03f" stroke-width="1" vector-effect="non-scaling-stroke" />
    </g>
    <g transform="translate(120,260)">
      <use href="#xylem_blobC" transform="scale(0.2)" fill="#e84393" fill-opacity="0.4" stroke="#e84393" stroke-width="1.5" vector-effect="non-scaling-stroke" />
      <use href="#xylem_blobA" transform="translate(-7,7) scale(0.1)" fill="#f4d03f" fill-opacity="0.5" stroke="#f4d03f" stroke-width="1" vector-effect="non-scaling-stroke" />
      <use href="#xylem_blobB" transform="translate(7,7) scale(0.1)" fill="#f4d03f" fill-opacity="0.5" stroke="#f4d03f" stroke-width="1" vector-effect="non-scaling-stroke" />
    </g>
  </g>

  <path id="xylem_1_arrow" d="M120,108 C119,90 121,65 120,42" stroke="#2c3e50" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrowhead)" />
</svg>
