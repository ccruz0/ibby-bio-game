<!--
  Cell compartmentalization diagram showing how eukaryotic cells use
  compartmentalization (membrane-bound organelles) for efficiency.
  Used in scenario/resolution scenes.
-->
<svg id="cell_compartments_1" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="comp_blob" d="M50,-20 C70,-15 80,25 65,55 C50,75 20,85 -20,75 C-60,60 -75,20 -70,-10 C-65,-40 -20,-55 20,-55 C45,-55 30,-25 50,-20 Z" />
  </defs>

  <!-- Main cell -->
  <ellipse cx="300" cy="200" rx="270" ry="185" fill="#ecf0f1" fill-opacity="0.3" stroke="#27ae60" stroke-width="3" />

  <!-- Title -->
  <text x="300" y="35" text-anchor="middle" font-family="Caveat, sans-serif" font-size="24" fill="#2c3e50" font-weight="bold">Compartmentalization in Eukaryotes</text>

  <!-- Nucleus: DNA/transcription compartment -->
  <g id="nucleus_comp">
    <use href="#comp_blob" transform="translate(150,120) scale(1.1)" fill="#9b59b6" fill-opacity="0.4" stroke="#9b59b6" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    <circle cx="150" cy="120" r="65" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.5" />
    <text x="150" y="115" text-anchor="middle" font-family="Caveat, sans-serif" font-size="16" fill="#2c3e50" font-weight="bold">Nucleus</text>
    <text x="150" y="135" text-anchor="middle" font-family="Caveat, sans-serif" font-size="11" fill="#2c3e50" opacity="0.8">DNA/</text>
    <text x="150" y="148" text-anchor="middle" font-family="Caveat, sans-serif" font-size="11" fill="#2c3e50" opacity="0.8">transcription</text>
  </g>

  <!-- Mitochondria: Energy compartment -->
  <g id="mitochondria_comp">
    <use href="#comp_blob" transform="translate(450,150) scale(0.95) rotate(20)" fill="#e74c3c" fill-opacity="0.4" stroke="#e74c3c" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    <text x="450" y="145" text-anchor="middle" font-family="Caveat, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">Mito</text>
    <text x="450" y="165" text-anchor="middle" font-family="Caveat, sans-serif" font-size="11" fill="#2c3e50" opacity="0.8">Energy</text>
  </g>

  <!-- Golgi: Protein processing compartment -->
  <g id="golgi_comp">
    <use href="#comp_blob" transform="translate(450,280) scale(0.85) rotate(-15)" fill="#f39c12" fill-opacity="0.4" stroke="#f39c12" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    <text x="450" y="275" text-anchor="middle" font-family="Caveat, sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">Golgi</text>
    <text x="450" y="295" text-anchor="middle" font-family="Caveat, sans-serif" font-size="11" fill="#2c3e50" opacity="0.8">Protein pack</text>
  </g>

  <!-- ER: Protein synthesis compartment -->
  <g id="er_comp">
    <use href="#comp_blob" transform="translate(150,280) scale(0.9) rotate(35)" fill="#3498db" fill-opacity="0.4" stroke="#3498db" stroke-width="2.5" vector-effect="non-scaling-stroke" />
    <text x="150" y="275" text-anchor="middle" font-family="Caveat, sans-serif" font-size="13" fill="#2c3e50" font-weight="bold">ER</text>
    <text x="150" y="295" text-anchor="middle" font-family="Caveat, sans-serif" font-size="11" fill="#2c3e50" opacity="0.8">Protein make</text>
  </g>

  <!-- Benefit box at bottom -->
  <rect x="60" y="360" width="480" height="35" fill="#f0f7ff" stroke="#2c3e50" stroke-width="2" rx="5" />
  <text x="300" y="385" text-anchor="middle" font-family="Caveat, sans-serif" font-size="14" fill="#2c3e50" font-weight="bold">
    Separate compartments = specialized functions + efficiency
  </text>
</svg>
