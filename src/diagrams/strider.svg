<!--
  HAND-TRACED from note-previews/notes-p-06.png ("Water striders (pond skaters) use surface
  tension to walk on water with their six legs" — hand-drawn strider with jointed legs
  resting in small dimples on a wavy water-surface line).
  This is the resolution-scene hero diagram (mystery payoff).
  Palette: water #87ceeb, ink #2c3e50.
-->
<svg id="strider_1" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <path id="strider_1_surface"
