    <path d="M225,96 C220,94 208,95 205,99 C203,102 206,105 212,105 C218,105 224,102 225,96 Z"
          fill="#2c3e50" fill-opacity="0.85" stroke="none" />

    <!-- 3 legs left, 3 legs right, each with a bend, feet resting in surface dimples -->
    <path d="M234,98 L182,112 L128,124" />
    <circle cx="128" cy="124" r="3" fill="none" />
