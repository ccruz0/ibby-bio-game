        stroke="#87ceeb" stroke-width="3" fill="none" stroke-linecap="round" />

  <g id="strider_1_bug" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- body: two small wobbly blobs (thorax + abdomen) -->
    <path d="M232,90 C238,84 262,84 268,91 C273,97 271,104 262,107 C250,110 236,108 231,101 C228,97 228,94 232,90 Z"
